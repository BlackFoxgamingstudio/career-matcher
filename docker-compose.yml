version: "3.9"
# Sovereign Career Matcher — docker-compose
# Usage: docker-compose up --build

services:
  career-matcher:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: sovereign-career-matcher:latest
    container_name: sovereign-career-matcher
    restart: unless-stopped
    ports:
      - "8796:8796"
    environment:
      SBB_NLP_MODEL: ${SBB_NLP_MODEL}
      SBB_JOB_BOARD_API_KEY: ${SBB_JOB_BOARD_API_KEY}
      SBB_ATS_RULES_PATH: ${SBB_ATS_RULES_PATH}
      SBB_SIMILARITY_THRESHOLD: ${SBB_SIMILARITY_THRESHOLD}
      SBB_API_KEY: ${SBB_API_KEY:-change-me}
      SBB_N8N_EVENT_BUS_URL: ${SBB_N8N_EVENT_BUS_URL:-http://host.docker.internal:5678/webhook/event-bus}
      SERVICE_PORT: 8796
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./.data:/app/.data:rw
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8796/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - sbb-platform

networks:
  sbb-platform:
    external: true
    name: sbb-platform-network
